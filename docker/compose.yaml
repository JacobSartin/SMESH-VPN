# SMESH-VPN test environment.
#
#   site-a (<prefix>.1.0/24)      core (<prefix>.0.0/24)      site-b (<prefix>.2.0/24)
#   client-a .10 ───────── router .254 ─────────────── client-b .10
#                                 │
#                           discovery .10
#
# The router forwards between the three networks without NAT, so clients reach
# each other and discovery directly. See docker/README.md.
name: smesh

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: smesh-vpn:dev
  init: true

x-client: &client
  <<: *node
  command: client
  cap_add: [NET_ADMIN]
  devices: ["/dev/net/tun:/dev/net/tun"]
  volumes: ["pki:/pki:ro"]
  depends_on:
    pki: { condition: service_completed_successfully }
    router: { condition: service_started }
    # Clients retry their initial registration, so discovery only needs to be
    # started, not ready.
    discovery: { condition: service_started }

x-client-env: &client-env
  DISCOVERY_URL: https://${NET_PREFIX:-172.30}.0.10:${DISCOVERY_PORT:-8081}
  LISTEN_PORT: ${LISTEN_PORT:-7777}
  MTU: ${MTU:-1400}

services:
  pki:
    <<: *node
    command: pki
    environment:
      CLIENTS: client-a client-b
    volumes: ["pki:/pki"]
    network_mode: none

  router:
    <<: *node
    command: router
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      core: { ipv4_address: "${NET_PREFIX:-172.30}.0.254" }
      site-a: { ipv4_address: "${NET_PREFIX:-172.30}.1.254" }
      site-b: { ipv4_address: "${NET_PREFIX:-172.30}.2.254" }

  discovery:
    <<: *node
    command: discovery
    cap_add: [NET_ADMIN]
    volumes: ["pki:/pki:ro"]
    depends_on:
      pki: { condition: service_completed_successfully }
    environment:
      DISCOVERY_IP: ${NET_PREFIX:-172.30}.0.10
      DISCOVERY_PORT: ${DISCOVERY_PORT:-8081}
      DISCOVERY_TTL: ${DISCOVERY_TTL:-2m}
      ROUTES: ${NET_PREFIX:-172.30}.0.0/16 via ${NET_PREFIX:-172.30}.0.254
    networks:
      core: { ipv4_address: "${NET_PREFIX:-172.30}.0.10" }

  client-a:
    <<: *client
    environment:
      <<: *client-env
      CLIENT_NAME: client-a
      VPN_IP: ${CLIENT_A_VPN_IP:-10.77.0.2/24}
      ROUTES: ${NET_PREFIX:-172.30}.0.0/16 via ${NET_PREFIX:-172.30}.1.254
    networks:
      site-a: { ipv4_address: "${NET_PREFIX:-172.30}.1.10" }

  client-b:
    <<: *client
    environment:
      <<: *client-env
      CLIENT_NAME: client-b
      VPN_IP: ${CLIENT_B_VPN_IP:-10.77.0.3/24}
      ROUTES: ${NET_PREFIX:-172.30}.0.0/16 via ${NET_PREFIX:-172.30}.2.254
    networks:
      site-b: { ipv4_address: "${NET_PREFIX:-172.30}.2.10" }

networks:
  core:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.30}.0.0/24" }] }
  site-a:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.30}.1.0/24" }] }
  site-b:
    ipam: { config: [{ subnet: "${NET_PREFIX:-172.30}.2.0/24" }] }

volumes:
  pki:
